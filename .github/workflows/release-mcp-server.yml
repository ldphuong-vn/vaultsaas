name: Release valt MCP server

# Builds the Rust MCP server for all supported platforms and attaches the
# binaries + SHA256 checksums to a GitHub Release when a mcp/v* tag is pushed.
# workflow_dispatch (no tag) builds everything but skips the release step —
# use it to smoke-test the pipeline.

on:
  push:
    tags:
      - 'mcp/v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: dynamic (standard) + static musl for servers/containers.
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # macOS: Apple Silicon (macos-latest) and Intel (macos-13).
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-13,         target: x86_64-apple-darwin }
          # Windows: MSVC — the canonical target. Do NOT use windows-gnu:
          # rustc's self-contained dlltool is broken (CreateProcess error
          # building windows-sys; verified locally on rust 1.98.1).
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-server
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        working-directory: mcp-server
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip mcp-server/target/${{ matrix.target }}/release/valt-mcp-server

      - name: Package and checksum
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          artifact="valt-mcp-server-${{ matrix.target }}${suffix}"
          cp "mcp-server/target/${{ matrix.target }}/release/valt-mcp-server${suffix}" "dist/${artifact}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${artifact}" > "${artifact}.sha256"
          else
            shasum -a 256 "${artifact}" > "${artifact}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: valt-mcp-server-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/mcp/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum valt-mcp-server-* > SHA256SUMS
          else
            shasum -a 256 valt-mcp-server-* > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/valt-mcp-server-*
            dist/SHA256SUMS
