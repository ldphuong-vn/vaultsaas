name: Release valt CLI

on:
  push:
    tags:
      - 'cli/v*'   # trigger on tags like cli/v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
          workdir: valt-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
