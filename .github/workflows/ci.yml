name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository }}/dashboard

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Go vet
        run: cd server && go vet ./...

      - name: Go build
        run: cd server && go build ./...

      - name: Go unit tests
        run: cd server && go test ./internal/... ./pkg/... -v -count=1

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        run: cd dashboard && npm ci

      - name: Type check
        run: cd dashboard && npx tsc --noEmit

      - name: Unit tests
        run: cd dashboard && npm test -- --run

      - name: Build
        run: cd dashboard && npm run build

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: valt-cli/go.sum

      - name: Build CLI
        run: cd valt-cli && go build ./...

      - name: CLI vet
        run: cd valt-cli && go vet ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-server, test-dashboard, test-cli]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:latest
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/valt

            # Pull latest images from GHCR
            docker compose -f docker-compose.prod.yml pull server dashboard migrate

            # Zero-downtime restart
            docker compose -f docker-compose.prod.yml up -d server dashboard

            # Prune old images
            docker image prune -f

            # Verify health
            sleep 10
            curl -sf http://localhost/health || echo "Health check failed"

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"Deploy failed for commit \`${{ github.sha }}\` by ${{ github.actor }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi

# Required GitHub Secrets:
#   VPS_HOST        - VPS IP address (e.g. 103.142.137.232)
#   VPS_USER        - SSH user on VPS (e.g. root)
#   VPS_SSH_KEY     - SSH private key contents for VPS access
#   SLACK_WEBHOOK_URL - (optional) Slack incoming webhook for deploy failure alerts
#
# GHCR auth uses GITHUB_TOKEN automatically (no extra secret needed).
# VPS must have docker + docker compose installed and /opt/valt checked out.
# docker-compose.prod.yml on VPS must reference GHCR images (see deploy-manual.yml comments).
